[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sim2skill"
version = "0.2.0"
description = "A Mac-friendly, simulation-first embodied manipulation interview project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "sim2skill contributors" }]
dependencies = [
  # 3.3.x is the last release line with prebuilt Intel macOS wheels.
  "mujoco>=3.3,<3.4",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
sim2skill = "sim2skill.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sim2skill"]

[tool.hatch.build.targets.wheel.force-include]
"src/sim2skill/assets" = "sim2skill/assets"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
